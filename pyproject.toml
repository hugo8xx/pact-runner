[project]
name = "pact-runner"
version = "0.1.0"
description = "Headless Claude Code for PACT Board: claims delegated work, runs it in a worktree, reports back"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "httpx2>=2.13",
    "mcp>=2.2",
]

[project.scripts]
pact-runner = "pact_runner.__main__:main"
pact-runner-guard = "pact_runner.guard:main"
pact-connect = "pact_runner.connect:main"
pact-hook = "pact_runner.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pact_runner"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    # The tests run the Runner against a real board in-process. Pinned to a commit; bump it on purpose.
    "pact-board @ git+https://github.com/hugo8xx/pact-board@c78cab8c20ac687338c1c6d90efd12432263455a",
]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E702"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
